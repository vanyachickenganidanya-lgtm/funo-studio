[package]
name = "tauri-plugin-funo-android"
version = "0.1.0"
description = "Android Java toolchain and embedded Amethyst bridge for Funo Studio"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-funo-android"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
