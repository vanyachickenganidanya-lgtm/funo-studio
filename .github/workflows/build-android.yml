name: Build Funo Studio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.3.13750724
  CARGO_INCREMENTAL: 0

jobs:
  build-android:
    name: Universal debug-signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Download source and embedded launcher
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check web interface
        run: npm run build

      - name: Initialize generated Android project
        run: npm run android:init

      - name: Enable launcher dependency repository
        shell: python
        run: |
          from pathlib import Path
          candidates = [Path("src-tauri/gen/android/settings.gradle.kts"), Path("src-tauri/gen/android/settings.gradle")]
          path = next((item for item in candidates if item.exists()), None)
          if path is None:
              raise SystemExit("Generated Android settings file was not found")
          value = path.read_text()
          if "jitpack.io" not in value:
              marker = "mavenCentral()"
              addition = 'maven("https://jitpack.io")' if path.suffix == ".kts" else "maven { url 'https://jitpack.io' }"
              value = value.replace(marker, marker + "\n        " + addition, 1)
              path.write_text(value)

      - name: Build installable universal APK
        run: npm run android:build:debug

      - name: List APK output
        shell: bash
        run: find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: funo-studio-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
