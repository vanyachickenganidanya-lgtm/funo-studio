[package]
name = "funo-studio"
version = "1.1.0"
description = "Быстрый редактор, CLI-компилятор и Minecraft SDK языка Funo"
authors = ["Funo Project"]
edition = "2021"
rust-version = "1.77.2"
default-run = "funo-studio"

[lib]
name = "funo_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.11"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-funo-android = { path = "../plugins/funo-android" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
